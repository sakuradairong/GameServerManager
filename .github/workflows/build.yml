name: Build Package

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: "构建Linux版本"
        required: false
        type: boolean
        default: true
      build_windows:
        description: "构建Windows版本"
        required: false
        type: boolean
        default: true
      build_docker:
        description: "构建Docker镜像"
        required: false
        type: boolean
        default: false
      build_docker_arm:
        description: "构建ARM64 Docker镜像"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build_linux:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js for build
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server
      - name: Build package
        run: npm run package:linux
        env:
          CI: true
          NODE_ENV: production
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gsm3-management-panel-linux-build
          path: dist/package/
          retention-days: 30

  build_windows:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server
      - name: Build package
        run: npm run package:windows
        env:
          CI: true
          NODE_ENV: production
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gsm3-management-panel-windows-build
          path: dist/package/
          retention-days: 30

  build_docker:
    if: github.repository == 'GSManagerXZ/GameServerManager' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_docker))
    runs-on: ubuntu-latest
    steps:
      # 第一步：检出代码
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        
      # 第二步：设置构建环境
      - name: 配置QEMU模拟器
        uses: docker/setup-qemu-action@v2
        
      - name: 配置Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: network=host
        
      # 第三步：登录所有镜像仓库
      - name: 登录Docker仓库
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # 第四步：构建并推送多架构镜像（带缓存功能）
      - name: 缓存并构建推送DockerHub多架构镜像
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            xiaozhu674/gameservermanager:${{ github.event_name == 'push' && github.ref_name || format('manual-{0}', github.run_number) }}
            ${{ github.event_name == 'push' && !contains(github.ref_name, '-') && 'xiaozhu674/gameservermanager:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_docker_arm:
    if: github.repository == 'GSManagerXZ/GameServerManager' && github.event_name == 'workflow_dispatch' && inputs.build_docker_arm
    runs-on: ubuntu-latest
    steps:
      # 第一步：检出代码
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      # 第二步：设置构建环境
      - name: 配置QEMU模拟器
        uses: docker/setup-qemu-action@v2

      - name: 配置Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: network=host

      # 第三步：登录Docker仓库
      - name: 登录Docker仓库
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 第四步：构建并推送ARM64镜像
      - name: 构建并推送ARM64镜像
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            xiaozhu674/gameservermanager:manual-${{ github.run_number }}-arm64-beta
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 创建发布版本（仅在推送标签时触发）
  create_release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build_linux, build_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: gsm3-management-panel-linux-build
          path: linux-build/
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: gsm3-management-panel-windows-build
          path: windows-build/
      - name: Create Linux tar.gz
        run: |
          cd linux-build
          tar -czf ../gsm3-management-panel-linux.tar.gz *
      - name: Create Windows zip
        run: |
          cd windows-build
          zip -r ../gsm3-management-panel-windows.zip *
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            gsm3-management-panel-linux.tar.gz
            gsm3-management-panel-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
